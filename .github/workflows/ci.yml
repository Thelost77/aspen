name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.6
          cache: true
      - run: go test ./... -count=1
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.6
          cache: true
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
